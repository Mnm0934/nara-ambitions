<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NEWS登録</title>

<style>
body{
  background:#02142c;
  color:white;
  text-align:center;
  font-family:'Noto Sans JP',sans-serif;
}

/* 入力フォーム全体 */
input, textarea, select{
  width:80%;
  max-width:400px;
  margin:10px;
  padding:12px;
  font-size:18px;
  border-radius:5px;
  border:none;
}

/* ドロップエリア */
.drop{
  border:2px dashed #ccc;
  padding:20px;
  margin:20px auto;
  width:80%;
  max-width:400px;
  cursor:pointer;
}

/* ボタン */
button{
  padding:12px 30px;
  font-size:18px;
  background:#d6002a;
  color:white;
  border:none;
  cursor:pointer;
}

.back-btn{
  margin-top:20px;
  background:#444;
}

@media (max-width:600px){
  input, textarea, select{
    width:90%;
    font-size:16px;
  }

  button{
    width:80%;
    max-width:300px;
    font-size:16px;
  }
}

</style>

</head>

<body style="display:none;">
<script>
const saved = localStorage.getItem("userLogin");

if(saved){
  const user = JSON.parse(saved);

  if(Date.now() < user.expire){
    document.body.style.display = "block";
  }else{
    alert("ログイン期限切れ");
    localStorage.removeItem("userLogin");
    location.href = "index.html";
  }

}else{
  alert("ログインしてください");
  location.href = "index.html";
}
</script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadString,
  getDownloadURL
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const app = initializeApp({
  apiKey: "AIzaSyAiyyqdgn6RaS_6-GlGcZzkaebgFnTUh8U",
  authDomain: "nara-ambitions.firebaseapp.com",
  projectId: "nara-ambitions",
  storageBucket: "nara-ambitions.firebasestorage.app",
  messagingSenderId: "690491149380",
  appId: "1:690491149380:web:e854ec4df26cd98c474011"
});

const db = getFirestore(app);
const storage = getStorage(app);


// Firebaseをグローバル化
window.db = db;
window.storage = storage;

window.collection = collection;
window.addDoc = addDoc;
window.getDocs = getDocs;
window.deleteDoc = deleteDoc;
window.doc = doc;
window.updateDoc = updateDoc;

window.storageRef = ref;
window.uploadString = uploadString;
window.getDownloadURL = getDownloadURL;


// アプリ開始
window.startApp = function(){
  if(window.loadNews){
    window.loadNews();
  }
};

</script>

<h2>NEWS登録</h2>

<h3 id="pendingCount" style="color:#ffeb3b;"></h3>

<input id="title" placeholder="タイトル"><br>
<input id="date" type="date"><br>

<div class="drop" onclick="file.click()" 
     ondragover="event.preventDefault()" 
     ondrop="dropFile(event)">
  ここに画像をドラッグ or タップで選択
</div>
<div id="preview"
     style="
       display:grid;
       grid-template-columns:repeat(2, 1fr);
       gap:10px;
       max-width:420px;
       margin:20px auto;
     ">
</div>
<br>

<button type="button" onclick="removeCurrentImage()">
🗑️画像を消す
</button>

<input type="file"
       id="file"
       accept="image/*"
       multiple
       style="display:none"
       onchange="selectFiles(this)">
<br>

<input id="link" placeholder="リンクURL"><br>

<select id="tag">
  <option value="result">試合結果</option>
  <option value="info">お知らせ</option>
  <option value="event">イベント</option>
</select><br>

<textarea id="content" placeholder="詳細文章"></textarea><br>

<button id="saveBtn" onclick="saveNews()">💾 保存</button>

<br><br>

<button onclick="location.href='member-only.html'">
部員専用ページに戻る</button>

<hr>

<h2>NEWS一覧</h2>
<div id="list"></div>


<script>

let news = [];

function updatePendingCount(){

  const count = news.filter(n => n.approved === false).length;

  document.getElementById("pendingCount").innerText =
    count > 0
      ? `⚠ 承認待ち：${count}件`
      : `✅ 承認待ちなし`;
}

let imgData = [];
let editIndex = null;

// 画像選択
// 写真を複数選択
function selectFiles(input){

  const files = Array.from(input.files);

  if(files.length > 10){
    alert("写真は10枚まで選択できます");
    input.value = "";
    return;
  }

  imgData = [];

  files.forEach(file => {
    readFile(file);
  });
}


// ドラッグ＆ドロップ
function dropFile(e){

  e.preventDefault();

  const files = Array.from(e.dataTransfer.files);

  if(files.length > 10){
    alert("写真は10枚までです");
    return;
  }

  imgData = [];

  files.forEach(file => {
    readFile(file);
  });
}


// 写真を読み込む
function readFile(file){

  if(!file.type.startsWith("image/")){
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    imgData.push(e.target.result);

    renderPreview();

  };

  reader.readAsDataURL(file);
}


// プレビュー表示
function renderPreview(){

  const preview = document.getElementById("preview");

  preview.innerHTML = "";

  imgData.forEach((img, index) => {

    preview.innerHTML += `
      <div style="
        position:relative;
        border:1px solid #555;
        padding:3px;
      ">

        <img
          src="${img}"
          style="
            width:100%;
            height:150px;
            object-fit:cover;
          "
        >

        <button
          type="button"
          onclick="removeImage(${index})"
          style="
            position:absolute;
            top:5px;
            right:5px;
            padding:4px 8px;
            font-size:14px;
            background:#d6002a;
          "
        >
          ×
        </button>

      </div>
    `;

  });
}


// 写真を1枚削除
function removeImage(index){

  imgData.splice(index, 1);

  renderPreview();

  document.getElementById("file").value = "";
}

// 保存（新規 or 編集）
async function saveNews(){

  try {

    if(imgData.length > 10){
      alert("写真は10枚までです");
      return;
    }


    // Firebase Storageへ写真をアップロード
    const photoUrls = [];

    for(let i = 0; i < imgData.length; i++){

      const image = imgData[i];

      // すでにStorage URLの場合
      if(image.startsWith("http")){
        photoUrls.push(image);
        continue;
      }

      const fileName =
        `news/${Date.now()}_${i}.jpg`;

      const storageRef =
        window.storageRef(
          window.storage,
          fileName
        );

      await window.uploadString(
        storageRef,
        image,
        "data_url"
      );

      const url =
        await window.getDownloadURL(storageRef);

      photoUrls.push(url);
    }


    const data = {

      title:
        document.getElementById("title").value,

      date:
        document.getElementById("date").value,

      // 写真URLを保存
      photos: photoUrls,

      // 古いデータとの互換用
      img:
        photoUrls.length > 0
          ? photoUrls[0]
          : "",

      link:
        document.getElementById("link").value,

      tag:
        document.getElementById("tag").value,

      content:
        document.getElementById("content").value,

      approved:
        editIndex !== null
          ? news[editIndex].approved
          : false
    };


    if(!data.title || !data.date){

      alert("タイトルと日付は必須です");
      return;

    }


    // 編集
    if(editIndex !== null){

      await window.updateDoc(

        window.doc(
          window.db,
          "news",
          news[editIndex].id
        ),

        data

      );

      editIndex = null;

      document.getElementById("saveBtn")
        .innerText = "💾 保存";

    }


    // 新規
    else{

      await window.addDoc(

        window.collection(
          window.db,
          "news"
        ),

        data

      );

    }


    clearForm();

    await loadNews();

    alert("保存しました！");


  } catch(error){

    console.error(error);

    alert(
      "保存に失敗しました。\n\n" +
      error.message
    );

  }

}


window.loadNews = async function(){

  const snap = await window.getDocs(
    window.collection(window.db, "news")
  );

  news = [];

  snap.forEach(docSnap => {
    news.push({
      id: docSnap.id,
      ...docSnap.data()
    });
  });

  renderList();
  updatePendingCount();
};

// 一覧表示
function renderList(){

  const saved = localStorage.getItem("userLogin");

  const role = saved
    ? JSON.parse(saved).role
    : "";

  const box = document.getElementById("list");

  box.innerHTML = "";

  news.forEach((n, i) => {

    // 表示する写真は1枚目だけ
    let firstImage = "";

    if(n.photos && n.photos.length > 0){
      firstImage = n.photos[0];
    }
    else if(n.img){
      firstImage = n.img;
    }


    box.innerHTML += `

      <div style="
        border:1px solid #fff;
        margin:10px;
        padding:10px;
      ">

        ${
          firstImage
          ?
          `
          <img
            src="${firstImage}"
            style="
              width:200px;
              height:150px;
              object-fit:cover;
              display:block;
              margin:0 auto 10px;
              border-radius:5px;
            "
          >
          `
          :
          ""
        }


        <br>

        <strong>${n.title}</strong>
        <br>

        ${n.date}
        <br><br>


        <button onclick="editNews(${i})">
          編集
        </button>

        <button onclick="deleteNews(${i})">
          削除
        </button>


        ${
          n.approved
          ?
          `
          <span style="color:#00e676;">
            ✅ 承認済
          </span>
          `
          :
          (
            role === "admin"
            ?
            `
            <button onclick="approveNews(${i})">
              承認
            </button>
            `
            :
            `
            <span style="color:#ff9800;">
              ⏳ 承認待ち
            </span>
            `
          )
        }

      </div>

    `;
  });
}
// 削除
async function deleteNews(i){

  if(!confirm("削除する？")) return;

await window.deleteDoc(
  window.doc(
    window.db,
    "news",
    news[i].id
  )
);
  loadNews();
}

// 画像だけ削除
async function deleteImage(i){

  if(!confirm("画像をすべて削除しますか？")){
    return;
  }

  try{

    await window.updateDoc(
      window.doc(
        window.db,
        "news",
        news[i].id
      ),
      {
        photos: [],
        img: ""
      }
    );

    alert("画像を削除しました");

    await loadNews();

  }catch(error){

    console.error(error);

    alert(
      "画像の削除に失敗しました。\n\n" +
      error.message
    );

  }
}
// 編集
function editNews(i){

  const n = news[i];

  document.getElementById("title").value = n.title;
  document.getElementById("date").value = n.date;
  document.getElementById("link").value = n.link;
  document.getElementById("tag").value = n.tag;
  document.getElementById("content").value = n.content;
  imgData = n.photos || [];


// 古いNEWSでphotosがない場合
if(imgData.length === 0 && n.img){
  imgData = [n.img];
}

renderPreview();

  editIndex = i;
  document.getElementById("saveBtn").innerText = "✏️ 更新する";
}

// プレビュー
function preview(i){

  const n = news[i];

  alert(
    "タイトル：" + n.title + "\n\n" +
    "日付：" + n.date + "\n\n" +
    "本文：" + n.content
  );
}

function removeCurrentImage(){

  imgData = [];

  document.getElementById("preview").innerHTML = "";

  document.getElementById("file").value = "";

}

// フォームクリア
function clearForm(){

  document.getElementById("title").value = "";
  document.getElementById("date").value = "";
  document.getElementById("link").value = "";
  document.getElementById("content").value = "";
  document.getElementById("tag").value = "result";

  imgData = [];
  editIndex = null;

  document.getElementById("preview").innerHTML = "";
  document.getElementById("file").value = "";

  document.getElementById("saveBtn").innerText = "💾 保存";
}

async function approveNews(i){

  const saved = localStorage.getItem("userLogin");

  const role = saved
    ? JSON.parse(saved).role
    : "";

  if(role !== "admin"){
    alert("権限がありません");
    return;
  }

  await window.updateDoc(
    window.doc(
      window.db,
      "news",
      news[i].id
    ),
    {
      approved: true
    }
  );

  await loadNews();

  alert("承認しました");
}

window.onload = function(){
  if(window.startApp){
    startApp();
  }
}

</script>

</body>
</html>
